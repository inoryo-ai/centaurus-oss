[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "centaurus-cache"
version = "0.1.0"
description = "Lightweight TTL response cache with normalization-aware keys, ideal for LLM/RAG response caching."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Centaurus Inc.", email = "centaurus.corp.ai@gmail.com" }]
keywords = ["cache", "ttl", "lru", "llm", "rag", "openai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/centaurus-inc/centaurus-cache"

[tool.hatch.build.targets.wheel]
packages = ["src/centaurus_cache"]
